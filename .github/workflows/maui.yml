name: MAUI

# The native MAUI project (src/Klyroo.Table.Maui) is not in the solution of the repository: it needs the MAUI workloads,
# so it is built here, per platform, with the .NET 10 SDK its global.json pins.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maui-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  android-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: klyroo-table
    steps:
      - uses: actions/checkout@v4
        with:
          path: klyroo-table
      - name: Check out klyroo-agent (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-agent
          path: klyroo-agent
      - name: Check out klyroo-dashboard (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-dashboard
          path: klyroo-dashboard
      - name: Check out klyroo-display (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-display
          path: klyroo-display
      - name: Check out klyroo-form (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-form
          path: klyroo-form
      - name: Check out klyroo-query (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-query
          path: klyroo-query
      - name: Check out klyroo-spreadsheet (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-spreadsheet
          path: klyroo-spreadsheet
      - name: Check out klyroo-stack (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-stack
          path: klyroo-stack
      - name: Check out klyroo-ui (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-ui
          path: klyroo-ui
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the MAUI Android workload
        run: dotnet workload install maui-android
      - name: Build for the plain framework (the target the tests run on)
        run: dotnet build src/Klyroo.Table.Maui -f net10.0 -c Release --nologo
      - name: Install the Android SDK packages the build needs
        run: dotnet build src/Klyroo.Table.Maui -f net10.0-android -t:InstallAndroidDependencies "-p:AndroidSdkDirectory=$ANDROID_HOME" -p:AcceptAndroidSDKLicenses=True --nologo
      - name: Build for Android
        run: dotnet build src/Klyroo.Table.Maui -f net10.0-android -c Release --nologo
      - name: Test
        run: dotnet test --project tests/Klyroo.Table.Maui.Tests -c Release --nologo

  apple:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: klyroo-table
    steps:
      - uses: actions/checkout@v4
        with:
          path: klyroo-table
      - name: Check out klyroo-agent (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-agent
          path: klyroo-agent
      - name: Check out klyroo-dashboard (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-dashboard
          path: klyroo-dashboard
      - name: Check out klyroo-display (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-display
          path: klyroo-display
      - name: Check out klyroo-form (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-form
          path: klyroo-form
      - name: Check out klyroo-query (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-query
          path: klyroo-query
      - name: Check out klyroo-spreadsheet (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-spreadsheet
          path: klyroo-spreadsheet
      - name: Check out klyroo-stack (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-stack
          path: klyroo-stack
      - name: Check out klyroo-ui (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-ui
          path: klyroo-ui
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install the MAUI iOS and Mac Catalyst workloads
        run: dotnet workload install maui-ios maui-maccatalyst
      - name: Build for iOS
        run: dotnet build src/Klyroo.Table.Maui -f net10.0-ios -c Release --nologo
      - name: Build for Mac Catalyst
        run: dotnet build src/Klyroo.Table.Maui -f net10.0-maccatalyst -c Release --nologo

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: klyroo-table
    steps:
      - uses: actions/checkout@v4
        with:
          path: klyroo-table
      - name: Check out klyroo-agent (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-agent
          path: klyroo-agent
      - name: Check out klyroo-dashboard (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-dashboard
          path: klyroo-dashboard
      - name: Check out klyroo-display (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-display
          path: klyroo-display
      - name: Check out klyroo-form (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-form
          path: klyroo-form
      - name: Check out klyroo-query (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-query
          path: klyroo-query
      - name: Check out klyroo-spreadsheet (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-spreadsheet
          path: klyroo-spreadsheet
      - name: Check out klyroo-stack (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-stack
          path: klyroo-stack
      - name: Check out klyroo-ui (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-ui
          path: klyroo-ui
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install the MAUI Windows workload
        run: dotnet workload install maui-windows
      - name: Build for Windows
        run: dotnet build src/Klyroo.Table.Maui -f net10.0-windows10.0.19041.0 -c Release --nologo
