name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klyroo-table
    steps:
      - uses: actions/checkout@v4
        with:
          path: klyroo-table
      - name: Check out klyroo-agent (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-agent
          path: klyroo-agent
      - name: Check out klyroo-dashboard (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-dashboard
          path: klyroo-dashboard
      - name: Check out klyroo-display (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-display
          path: klyroo-display
      - name: Check out klyroo-form (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-form
          path: klyroo-form
      - name: Check out klyroo-query (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-query
          path: klyroo-query
      - name: Check out klyroo-spreadsheet (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-spreadsheet
          path: klyroo-spreadsheet
      - name: Check out klyroo-stack (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-stack
          path: klyroo-stack
      - name: Check out klyroo-ui (referenced by relative path)
        uses: actions/checkout@v4
        with:
          repository: klyroo/klyroo-ui
          path: klyroo-ui
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
      - name: Restore
        run: dotnet restore Klyroo.Table.slnx
      - name: Build
        run: dotnet build Klyroo.Table.slnx -c Release --no-restore --nologo
      - name: Test
        run: dotnet test Klyroo.Table.slnx -c Release --no-build --nologo
      - name: NativeAOT and trimming analyzers on the .Core libraries
        run: |
          # Only the libraries that declare NativeAOT compatibility: the global properties would otherwise also flow into
          # projects they reference that are not meant to be trimmed (the docs site, for example).
          for core in src/*.Core/*.csproj; do
            grep -q '<IsAotCompatible>true</IsAotCompatible>' "$core" || continue
            dotnet build "$core" -c Release -p:EnableAotAnalyzer=true -p:EnableTrimAnalyzer=true --nologo
          done
      - name: Formatting report
        # Reported, not blocking yet: the code predates .editorconfig. Remove continue-on-error after a one-time
        # `dotnet format` commit.
        continue-on-error: true
        run: dotnet format Klyroo.Table.slnx --verify-no-changes --no-restore --include src/ tests/ examples/
      - name: Pack
        run: dotnet pack Klyroo.Table.slnx -c Release --no-build -o ./artifacts/nupkgs --nologo
      - name: Verify NuGet metadata
        run: |
          fail=0
          for p in ./artifacts/nupkgs/*.nupkg; do
            spec=$(unzip -p "$p" '*.nuspec')
            for tag in '<id>' '<version>' '<authors>' '<description>' '<license type="expression">MIT' '<readme>' '<projectUrl>' '<repository type="git" url="https://github.com/klyroo/' '<tags>'; do
              if ! grep -qF "$tag" <<<"$spec"; then echo "::error::$(basename "$p"): missing $tag"; fail=1; fi
            done
            if grep -qiE '\blux\b|luxstack' <<<"$spec"; then echo "::error::$(basename "$p"): old brand in metadata"; fail=1; fi
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs-klyroo-table
          path: klyroo-table/artifacts/nupkgs/*
