name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore & Build
        run: dotnet build Lux.Table.slnx -c Release --nologo
      - name: Run Tests
        run: dotnet test Lux.Table.slnx -c Release --no-build --nologo
      - name: Verify Trim & NativeAOT Analyzers on Core Libraries
        run: |
          for core in src/*.Core/*.csproj; do
            [ -f "$core" ] && dotnet build "$core" -c Release -p:EnableAotAnalyzer=true -p:EnableTrimAnalyzer=true --nologo
          done

      - name: Pack NuGet Artifacts
        run: dotnet pack Lux.Table.slnx -c Release --no-build -o ./artifacts/nupkgs --nologo
      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs-lux-table
          path: ./artifacts/nupkgs/*.nupkg
